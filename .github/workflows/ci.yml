name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DDD.sln

      - name: Build
        run: dotnet build DDD.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --project UnitTest-Point/UnitTest.csproj --configuration Release --no-build
